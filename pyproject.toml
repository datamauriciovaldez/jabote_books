[project]
name = "audiolibro-libre"
version = "0.1.0"
description = "Convierte un libro en un audiolibro, 100 % en local y gratis."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "soundfile>=0.12",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "pypdfium2>=4.30",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["tts/voices.json", "web/static/**/*", "samples/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: necesita descargar una voz o usar espeak-ng (omitir con -m 'not slow')"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S603", "S607"]  # assert en tests; subprocess con listas fijas (ffmpeg/espeak)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"tools/*" = ["S310"]
"tools/gen_licenses.py" = ["E501"]  # plantilla de documentación
